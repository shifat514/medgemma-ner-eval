[project]
name = "medgemma-ner-eval"
version = "0.1.0"
description = "Zero-shot evaluation of Google MedGemma on clinical NER, combinable with clinical-ner-eval"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.50",
    "torch>=2.2",
    "datasets>=2.20,<3.0",
    "bioc>=2.0",
    "seqeval>=1.2.2",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "numpy>=1.26",
    "pandas>=2.2",
    "tqdm>=4.66",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Only needed for L4 of the recall benchmark's matching ladder. It is imported
# lazily and the ladder stops at L3 without it, so L1-L3 stay runnable on a
# CPU-only laptop and only the GPU box needs this.
embed = ["sentence-transformers>=3.0"]
# Only needed to build the MIMIC sample from an s3:// source. The evaluation
# itself reads a local file, so a GPU/Colab install does not need this.
s3 = ["boto3>=1.34"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
