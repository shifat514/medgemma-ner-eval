[project]
name = "medgemma-ner-eval"
version = "0.1.0"
description = "Zero-shot evaluation of Google MedGemma on clinical NER, combinable with clinical-ner-eval"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.50",
    "torch>=2.2",
    "datasets>=2.20,<3.0",
    "bioc>=2.0",
    "seqeval>=1.2.2",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "numpy>=1.26",
    "pandas>=2.2",
    "tqdm>=4.66",
    "huggingface_hub>=0.24",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
